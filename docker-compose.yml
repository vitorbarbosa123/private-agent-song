# Uso:
#   docker compose up --build                       # web em http://localhost:8501 e API em :8710/docs
#   docker compose run --rm chat                    # chat no terminal
#   docker compose run --rm chat --now 2026-03-02T10:30 --debug
#   docker compose run --rm tests                   # testes (não precisam de chave de API)
#   docker compose run --rm llm-check               # confere a configuração do modelo
#   docker compose run --rm eval --judge --judge-model google/gemini-2.5-pro
#   docker compose run --rm handoffs                # painel da equipe no terminal
#   docker compose --profile observability up      # + Langfuse local em http://localhost:3000
#
# A chave e o modelo vêm do arquivo .env (veja .env.example). O histórico das conversas e
# os atendimentos ficam no volume "emporio-state", compartilhado entre web e terminal.

include:
  - docker-compose.langfuse.yml  # serviços do Langfuse (só com --profile observability)

x-app: &app
  build:
    context: .
    target: runtime
  image: emporio-agent:latest
  env_file:
    - path: .env
      required: false
  environment:
    EMPORIO_STATE_DIR: /app/var
    # Dentro da rede do compose o Langfuse local responde em langfuse-web (não em localhost).
    LANGFUSE_HOST: ${LANGFUSE_DOCKER_HOST:-http://langfuse-web:3000}
  volumes:
    - emporio-state:/app/var

services:
  web:
    <<: *app
    ports:
      - "8501:8501"
    restart: unless-stopped

  api:
    <<: *app
    entrypoint: ["emporio-api"]
    environment:
      EMPORIO_STATE_DIR: /app/var
      LANGFUSE_HOST: ${LANGFUSE_DOCKER_HOST:-http://langfuse-web:3000}
      EMPORIO_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${EMPORIO_API_PORT:-8710}:8000"   # só localhost; porta configurável
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  chat:
    <<: *app
    profiles: [cli]
    entrypoint: ["emporio-chat"]
    stdin_open: true
    tty: true

  llm-check:
    <<: *app
    profiles: [cli]
    entrypoint: ["emporio-llm-check"]

  handoffs:
    <<: *app
    profiles: [cli]
    entrypoint: ["emporio-handoffs"]

  eval:
    <<: *app
    profiles: [cli]
    entrypoint: ["emporio-eval-agent"]
    volumes:
      - emporio-state:/app/var
      - ./evals/results:/app/evals/results

  eval-retrieval:
    <<: *app
    profiles: [cli]
    entrypoint: ["emporio-eval-retrieval"]

  tests:
    build:
      context: .
      target: dev
    image: emporio-agent:dev
    profiles: [cli]

volumes:
  emporio-state:
