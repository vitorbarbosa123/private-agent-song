[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (desafio técnico AI Engineer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.7.3",
    "pandas>=2.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=5.0",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
emporio-clean-data = "emporio.data.pipeline:main"
emporio-llm-check = "emporio.llm:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
