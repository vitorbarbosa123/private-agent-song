[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (desafio técnico AI Engineer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-openai>=1.7.3",
    "langfuse>=5.1.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pandas>=2.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=5.0",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "snowballstemmer>=3.1.1",
    "streamlit>=1.66.1",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
emporio-clean-data = "emporio.data.pipeline:main"
emporio-llm-check = "emporio.llm:main"
emporio-eval-retrieval = "emporio.rag.evaluate:main"
emporio-chat = "emporio.cli:main"
emporio-handoffs = "emporio.handoff:main"
emporio-eval-agent = "emporio.evals.agent_eval:main"
emporio-export-examples = "emporio.evals.examples:main"
emporio-api = "emporio.api:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: estilo · F: erros (imports, nomes) · I: ordem de imports · B: bugs comuns · UP: Python moderno
select = ["E", "W", "F", "I", "B", "UP"]
